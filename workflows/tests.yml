name: PropDesk Automated Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  backend-tests:
    name: FastAPI + SQL Matching & Permissions Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: propdesk
          POSTGRES_PASSWORD: propdesk_test_password
          POSTGRES_DB: propdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://propdesk:propdesk_test_password@localhost:5432/propdesk_test
        run: |
          alembic upgrade head

      - name: Run automated test suite (unittest / pytest)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          pytest -v
